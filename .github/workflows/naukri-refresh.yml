name: Scheduled Naukri Profile Refresh (Account 2)

on:
  schedule:
    # Morning wake-up watchdog (triggers between 8:00 AM and 9:00 AM IST)
    - cron: '07 3 * * 1-5'  # 08:37 AM IST, Mon-Fri (awkward non-congested minute)
  workflow_dispatch: # Allows manual trigger from GitHub web UI / chaining
    inputs:
      mode:
        description: 'Run mode: session (full scheduled day) or single (1 immediate cycle)'
        required: false
        default: 'session'

concurrency:
  group: naukri-refresh-account2
  cancel-in-progress: true

jobs:
  refresh:
    name: Scheduled Naukri Profile Refresher (Account 2)
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      actions: write
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm install
          npx --yes playwright-core install --with-deps chromium

      - name: Run Cloud Profile Refresh Session
        env:
          NAUKRI_SESSION_B64: ${{ secrets.NAUKRI_SESSION_B64 }}
          SKIP_CV_UPLOAD: "true"
          CI: true
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SCHEDULE_SLOTS: "09:15,10:45,12:15,13:45,15:15,16:45,18:15"
          SINGLE_RUN: ${{ inputs.mode == 'single' }}
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1280x900x24" node run-cloud-schedule.js

      - name: Upload Screenshot on Failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: error-screenshot
          path: "*.png"
          if-no-files-found: ignore
