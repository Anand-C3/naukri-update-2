name: Scheduled Naukri Profile Refresh (Account 2)

on:
  schedule:
    # 9:15 AM, 10:45 AM, 12:15 PM, 1:45 PM, 3:15 PM, 4:45 PM, 6:15 PM IST (UTC+5:30) - Monday to Friday only (45-min alternating with Account 1)
    - cron: '45 3 * * 1-5'  # 09:15 AM IST, Mon-Fri
    - cron: '15 5 * * 1-5'  # 10:45 AM IST, Mon-Fri
    - cron: '45 6 * * 1-5'  # 12:15 PM IST, Mon-Fri
    - cron: '15 8 * * 1-5'  # 01:45 PM IST, Mon-Fri
    - cron: '45 9 * * 1-5'  # 03:15 PM IST, Mon-Fri
    - cron: '15 11 * * 1-5' # 04:45 PM IST, Mon-Fri
    - cron: '45 12 * * 1-5' # 06:15 PM IST, Mon-Fri
  workflow_dispatch: # Allows manual trigger from GitHub web UI

concurrency:
  group: naukri-refresh-account2
  cancel-in-progress: true

jobs:
  refresh:
    name: Scheduled Naukri Profile Refresher (Account 2)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: write
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm install
          npx --yes playwright-core install --with-deps chromium

      - name: Run Profile Refresh (1 Cycle - Headline Only)
        env:
          NAUKRI_SESSION_B64: ${{ secrets.NAUKRI_SESSION_B64 }}
          SKIP_CV_UPLOAD: "true"
          CI: true
          REFRESH_CYCLES: 1
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1280x900x24" node naukri-profile-refresh.js

      - name: Upload Screenshot on Failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: error-screenshot
          path: "*.png"
          if-no-files-found: ignore
